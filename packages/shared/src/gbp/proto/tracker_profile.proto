syntax = "proto3";

import "profile.proto";
import "suite_master.proto";

message TrackerProfile {
  string uid = 1;
  string name = 2;
  uint32 level = 3;
  string introduction = 4;
  TrackerProfileAvatar avatar = 5;
  TrackerProfileBand band = 6;
  repeated uint32 titles = 7;
}

message TrackerProfileAvatar {
  uint32 situationId = 1;
  string illust = 2;
  uint32 characterId = 3;
  uint32 bandId = 4;
  uint32 rarity = 5;
  string attribute = 6;
  string prefix = 7;
  string resourceSetName = 8;
}

message TrackerProfileBand {
  string name = 1;
  repeated TrackerProfileBandMember members = 2;
  repeated MasterAreaItem areaItems = 3;
}

message TrackerProfileBandMember {
  UserSituation value = 1;
  MasterSituationParameter power = 2;
  MasterSkill skill = 3;
  string skillName = 4;
  uint32 characterId = 5;
  uint32 bandId = 6;
  uint32 rarity = 7;
  string attribute = 8;
  string prefix = 9;
  string resourceSetName = 10;
  float eventPointBonus = 11;
  TrackerProfileBandMemberBonus powerBonus = 12;
}

message TrackerProfileBandMemberBonus {
  MasterSituationParameterFloat card = 11;
  MasterSituationParameterFloat potential = 12;
  MasterSituationParameterFloat mission = 13;
  MasterSituationParameterFloat areaItemsMultiplier = 14;
  MasterSituationParameterFloat event = 15;
}

message MasterSituationParameterFloat {
  float performance = 3;
  float technique = 4;
  float visual = 5;
}
